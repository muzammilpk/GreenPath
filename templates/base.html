<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}GreenPath — Sustainable Travel & Route Planner{% endblock %}</title>

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- FontAwesome 6 Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- Top Navbar -->
  <nav class="navbar">
    <div class="nav-container">
      <a href="{% url 'home' %}" class="brand-logo">
        <span class="brand-icon">🌲</span>
        <span>GreenPath</span>
      </a>

      <div class="nav-links">
        <a href="{% url 'home' %}" class="nav-link {% if active_page == 'home' %}active{% endif %}">Home</a>
        <a href="{% url 'plan_trip' %}" class="nav-link {% if active_page == 'plan' %}active{% endif %}">Plan Trip</a>
        <a href="{% url 'dashboard' %}" class="nav-link {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
        <a href="{% url 'reports' %}" class="nav-link {% if active_page == 'reports' %}active{% endif %}">Reports</a>
        <a href="{% url 'about' %}" class="nav-link {% if active_page == 'about' %}active{% endif %}">About</a>
      </div>

      <div class="auth-actions">
        {% if user.is_authenticated %}
          <a href="{% url 'dashboard' %}" class="user-nav-badge" title="Logged in as {{ user.username }}">
            <i class="fa-solid fa-user"></i>
            <span>{{ user.username }}</span>
          </a>
          <a href="{% url 'logout' %}" class="btn-logout">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </a>
        {% else %}
          <a href="{% url 'login' %}" class="btn-login">Login</a>
          <a href="{% url 'register' %}" class="btn-register">Register</a>
        {% endif %}
      </div>
    </div>
  </nav>


  <!-- Main Content Wrapper -->
  <main class="page-container">
    {% block content %}{% endblock %}
  </main>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  {% block extra_js %}{% endblock %}
</body>
</html>
