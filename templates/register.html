{% extends 'base.html' %}

{% block title %}Create Account — GreenPath{% endblock %}

{% block content %}
<div style="max-width: 460px; margin: 2.5rem auto; background: var(--bg-white); border-radius: var(--radius-card); padding: 2.5rem; box-shadow: var(--shadow-card); border: 1px solid var(--border-light);">
  
  <div style="text-align: center; margin-bottom: 2rem;">
    <div style="font-size: 2.8rem; margin-bottom: 0.5rem;">🌱</div>
    <h1 style="font-size: 1.8rem; font-weight: 800; color: var(--text-dark);">Join GreenPath</h1>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Start tracking carbon savings and eco-friendly travel today</p>
  </div>

  {% if error %}
  <div style="background: #fef2f2; border: 1px solid #fecaca; color: #dc2626; padding: 0.75rem 1rem; border-radius: var(--radius-input); font-size: 0.88rem; font-weight: 600; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span>{{ error }}</span>
  </div>
  {% endif %}

  <form method="POST" action="{% url 'register' %}">
    {% csrf_token %}

    <div class="form-group-custom" style="margin-bottom: 1.15rem;">
      <label class="form-label-custom" for="username">Username</label>
      <input type="text" name="username" id="username" class="form-input-white" placeholder="Choose a username" required autofocus autocomplete="username">
    </div>

    <div class="form-group-custom" style="margin-bottom: 1.15rem;">
      <label class="form-label-custom" for="email">Email Address (Optional)</label>
      <input type="email" name="email" id="email" class="form-input-white" placeholder="name@example.com" autocomplete="email">
    </div>

    <div class="form-group-custom" style="margin-bottom: 1.15rem;">
      <label class="form-label-custom" for="password">Password</label>
      <input type="password" name="password" id="password" class="form-input-white" placeholder="Create a strong password" required autocomplete="new-password">
    </div>

    <div class="form-group-custom" style="margin-bottom: 1.75rem;">
      <label class="form-label-custom" for="confirm_password">Confirm Password</label>
      <input type="password" name="confirm_password" id="confirm_password" class="form-input-white" placeholder="Re-enter your password" required autocomplete="new-password">
    </div>

    <button type="submit" class="btn-cta-green" style="width: 100%; padding: 0.85rem; font-size: 1rem; cursor: pointer; border-radius: var(--radius-input);">
      <i class="fa-solid fa-user-plus"></i> Create My Account
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-light); font-size: 0.9rem; color: var(--text-muted);">
    Already have an account? 
    <a href="{% url 'login' %}" style="color: var(--primary-green-hover); font-weight: 700; text-decoration: none;">Sign in here</a>
  </div>

</div>
{% endblock %}
